<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">VISTA-Bench evaluation architecture</title>
  <desc id="desc">Images or OCR are sent to a candidate model. Candidate text and a rubric are sent to a text-only judge, followed by deterministic scoring and aggregate summaries.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <style>
      .title{font:700 24px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}
      .label{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}
      .sub{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}
      .chip{font:700 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#3730a3}
      .box{fill:#fff;stroke:#cbd5e1;stroke-width:2}
      .flow{fill:none;stroke:#64748b;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <text x="48" y="52" class="title">VISTA-Bench · multimodal translation evaluation</text>

  <rect x="45" y="105" width="185" height="155" rx="18" class="box"/>
  <rect x="65" y="128" width="72" height="26" rx="13" fill="#e0e7ff"/>
  <text x="101" y="146" text-anchor="middle" class="chip">IMAGE</text>
  <rect x="65" y="165" width="56" height="45" rx="6" fill="#dbeafe" stroke="#60a5fa"/>
  <path d="M72 202l13-14 10 9 9-11 11 16z" fill="#60a5fa"/>
  <text x="137" y="190" class="label">or</text>
  <rect x="158" y="165" width="52" height="45" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <path d="M166 176h36M166 187h36M166 198h25" stroke="#64748b" stroke-width="3"/>
  <text x="137" y="236" text-anchor="middle" class="sub">released OCR · text track</text>

  <path d="M230 182H292" class="flow"/>

  <rect x="300" y="120" width="190" height="125" rx="18" class="box"/>
  <circle cx="340" cy="170" r="22" fill="#ddd6fe"/>
  <path d="M328 171h24M340 159v24" stroke="#7c3aed" stroke-width="4"/>
  <text x="374" y="169" class="label">Candidate</text>
  <text x="374" y="193" class="sub">self-segmented translation</text>
  <text x="395" y="226" text-anchor="middle" class="sub">image or OCR in · candidate text out</text>

  <path d="M490 182H552" class="flow"/>

  <rect x="560" y="92" width="225" height="180" rx="18" class="box"/>
  <rect x="580" y="112" width="91" height="26" rx="13" fill="#dcfce7"/>
  <text x="626" y="130" text-anchor="middle" class="chip" fill="#166534">TEXT ONLY</text>
  <text x="580" y="169" class="label">Judge</text>
  <text x="580" y="194" class="sub">candidate + source blocks</text>
  <text x="580" y="216" class="sub">target-specific checklist</text>
  <rect x="580" y="232" width="185" height="24" rx="8" fill="#fff7ed" stroke="#fdba74"/>
  <text x="672" y="249" text-anchor="middle" class="sub">rubric + tolerances</text>
  <path d="M672 312V277" class="flow"/>
  <rect x="610" y="314" width="125" height="28" rx="14" fill="#ffedd5"/>
  <text x="672" y="333" text-anchor="middle" class="chip" fill="#9a3412">RUBRIC</text>

  <path d="M785 182H847" class="flow"/>

  <rect x="855" y="120" width="135" height="125" rx="18" class="box"/>
  <text x="922" y="166" text-anchor="middle" class="label">Scoring</text>
  <text x="922" y="192" text-anchor="middle" class="sub">deterministic</text>
  <text x="922" y="214" text-anchor="middle" class="sub">scoring</text>

  <path d="M990 182H1052" class="flow"/>

  <rect x="1060" y="120" width="100" height="125" rx="18" class="box"/>
  <path d="M1085 207v-28M1108 207v-48M1131 207v-68" stroke="#4f46e5" stroke-width="10" stroke-linecap="round"/>
  <text x="1110" y="232" text-anchor="middle" class="label">Summary</text>
</svg>
